name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pylint
        run: pip install pylint

      - name: Run Python
        run: python x.py

      - name: Run Pylint
        run: pylint x.py

      - name: Run PyUnit
        run: python -m unittest test_x.py